{% extends "base.html" %}
{% block content %}
<article class="post">
  <header class="post-header"><h1>{{ page.title }}</h1></header>
  <div class="prose">
    {{ page.content | safe }}
    <ul>
      {%- for link in config.extra.links %}
      <li><a href="{{ link.url }}" rel="me">{{ link.name }}</a></li>
      {%- endfor %}
      {%- if config.extra?.email %}
      <li><a href="mailto:{{ config.extra.email }}">{{ config.extra.email }}</a></li>
      {%- endif %}
    </ul>
  </div>
</article>
{% endblock content %}
