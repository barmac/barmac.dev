# Site settings. `zola serve` overrides base_url with localhost automatically,
# and the GitHub Actions workflow overrides it with your Pages URL.
base_url = "https://barmac.github.io"
title = "Maciej Barelkowski"
description = "Maciej Barelkowski works on bpmn.io at Camunda and writes about BPMN, DMN, JavaScript and the web."
default_language = "en"

compile_sass = false
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = true
# Treat posts as plain Markdown, so `{{` or `{%` in code samples never breaks the build.
skip_content_templating = ["**/*.md"]

taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[extra]
# Everything below is yours to edit — it's used in the header, footer and About page.
author = "Maciej Barelkowski"
tagline = "I work on bpmn.io at Camunda, building open-source tools for modelling BPMN, DMN and forms in the browser. Based in Poznań, Poland."
# email = "you@example.com"   # uncomment to show an Email link in the footer and on the About page
links = [
  { name = "GitHub", url = "https://github.com/barmac" },
]
nav = [
  { name = "Blog", path = "/blog/" },
  { name = "Tags", path = "/tags/" },
  { name = "About", path = "/about/" },
]
